<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>

        function wellcome (){
            let name = prompt("enter your name")
            alert("wellcome,"+name+"!")
        }
    </script>
</head>
<body>
    <button onclick="wellcome()">click me</button>
</body>
</html>
