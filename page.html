    <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #7cb342;
    font-family: Arial, Helvetica, sans-serif;
  }

  .card {
    background: #fff;
    width: 320px;
    padding: 40px 30px;
    border-radius: 3px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  input {
    width: 100%;
    background: #eeeeee;
    border: none;
    padding: 14px 12px;
    font-size: 14px;
    color: #555;
    margin-bottom: 16px;
    outline: none;
  }
  input::placeholder { color: #9a9a9a; }
  input:focus { background: #e6e6e6; }

  .login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    background: #5cb85c;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 16px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: #4ca64c; }

  .register-text {
    text-align: center;
    font-size: 13px;
    color: #888;
  }
  .register-text a {
    color: #5cb85c;
    text-decoration: none;
    font-weight: bold;
  }
  .register-text a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="card">
    <form>
      <input type="text" id="username" placeholder="username">
      <input type="password" id="password" placeholder="password">
      <button type="submit" class="login-btn">LOGIN</button>
    </form>
    <div class="register-text">
      Not registered? <a href="#">Create an account</a>
    </div>
  </div>

</body>
</html>
</body>
</html>
